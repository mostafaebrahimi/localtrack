[package]
name = "localtrack-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop application services for LocalTrack: queries, reports, exports, diagnostics"

[dependencies]
localtrack-core = { workspace = true }
localtrack-storage = { workspace = true }
localtrack-collector-common = { workspace = true }
localtrack-export = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
localtrack-collector-linux = { workspace = true }

[target.'cfg(windows)'.dependencies]
localtrack-collector-windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
